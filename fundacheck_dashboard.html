const frame=document.getElementById('frame');
const btns=[...document.querySelectorAll('.nav')];
function go(k){
  btns.forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  frame.style.height='100vh';
  frame.src=PAGES[k];
}
btns.forEach(b=>b.addEventListener('click',()=>go(b.dataset.k)));
window.addEventListener('message',e=>{
  if(e.data&&e.data.t==='fh'&&e.source===frame.contentWindow){
    frame.style.height=e.data.v+'px';
  }
});
document.getElementById('mini').addEventListener('click',function(){
  document.body.classList.toggle('min');
  this.textContent=document.body.classList.contains('min')?'»':'« Minimize';
});
go('dashboard');
</script>
