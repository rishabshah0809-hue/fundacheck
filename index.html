<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9ece8" />
    <meta
      name="description"
      content="FundaCheck — a calm, sector-aware fundamental analysis workspace."
    />
    <title>FundaCheck · Fundamental analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body data-theme="light">
    <div id="app-shell">
      <div class="mobile-backdrop" data-action="close-menu" aria-hidden="true"></div>
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <div class="sidebar-top">
          <div class="sidebar-head">
            <div class="brand-lockup">
              <div class="brand-mark" aria-hidden="true">F</div>
              <div>
                <div class="brand-name">FundaCheck</div>
                <div class="brand-caption">FUNDAMENTAL WORKSPACE</div>
              </div>
            </div>
            <button class="sidebar-collapse-toggle" type="button" data-action="toggle-sidebar" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar">
              <span class="sidebar-collapse-icon" data-icon="chevron-left" aria-hidden="true"></span>
              <span class="sidebar-collapse-label">Collapse sidebar</span>
              <span class="sr-only">Collapse sidebar</span>
            </button>
          </div>

          <div id="sidebar-dataset" class="sidebar-dataset" hidden></div>
          <nav class="nav-list" aria-label="Workspace pages">
            <button class="nav-item is-active" data-page="dashboard" type="button" aria-label="Dashboard" title="Dashboard">
              <span class="nav-icon" data-icon="grid" aria-hidden="true"></span>
              <span>Dashboard</span>
            </button>
            <button class="nav-item" data-page="ratios" type="button" aria-label="Ratio deep dive" title="Ratio deep dive">
              <span class="nav-icon" data-icon="chart" aria-hidden="true"></span>
              <span>Ratio deep dive</span>
            </button>
            <button class="nav-item" data-page="lens" type="button" aria-label="Sector lens" title="Sector lens">
              <span class="nav-icon" data-icon="pie" aria-hidden="true"></span>
              <span>Sector lens</span>
            </button>
            <button class="nav-item" data-page="statements" type="button" aria-label="Statements" title="Statements">
              <span class="nav-icon" data-icon="file" aria-hidden="true"></span>
              <span>Statements</span>
            </button>
            <button class="nav-item" data-page="qa" type="button" aria-label="Ask the analyst" title="Ask the analyst">
              <span class="nav-icon" data-icon="message" aria-hidden="true"></span>
              <span>Ask the analyst</span>
            </button>
          </nav>
        </div>

      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" type="button" data-action="open-menu" aria-label="Open navigation">
            <span data-icon="menu" aria-hidden="true"></span>
          </button>
          <div class="topbar-context" id="topbar-context">
            <span class="context-dot" aria-hidden="true"></span>
            <span id="topbar-label">New analysis</span>
          </div>
          <div class="topbar-actions">
            <button class="icon-button theme-toggle" type="button" data-action="toggle-theme" aria-label="Switch theme">
              <span data-icon="sun" class="theme-sun" aria-hidden="true"></span>
              <span class="theme-track" aria-hidden="true"><span class="theme-thumb"></span></span>
              <span data-icon="moon" class="theme-moon" aria-hidden="true"></span>
            </button>
          </div>
        </header>

        <div class="page-wrap" id="page-wrap">
          <section id="page" aria-live="polite"></section>
        </div>
      </main>
    </div>

    <input id="file-input" type="file" accept=".xlsx,.xlsm,.csv" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="loading" class="loading-overlay" hidden>
      <div class="loading-card">
        <span class="loader-ring" aria-hidden="true"></span>
        <strong id="loading-label">Reading your financials</strong>
        <span>Keeping the workbook in memory for this session.</span>
      </div>
    </div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
